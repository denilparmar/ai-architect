# .github/workflows/ci.yml
#
# PR and main-branch CI for the AI Architect MVP.
#
# Rules this workflow enforces:
# - No secrets. Nothing here calls the live Claude API or any cloud account.
#   Live checks run in live-eval.yml, from a protected environment.
# - Tests use the fake LLM client (ARCHITECT_LLM_BACKEND=fake).
# - Terraform is rendered and validated, never planned or applied here.
#
# Every third-party action is pinned to a commit SHA, with the tag in a comment.
# Dependabot or Renovate can keep these up to date.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run when a new commit lands on the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Jobs that need more ask for it explicitly.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.20"
  TERRAFORM_VERSION: "1.16.4"

jobs:
  # ---------------------------------------------------------------------------
  # Lint and type check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

  # ---------------------------------------------------------------------------
  # Unit and integration tests, fake LLM only
  # Also covers catalog/archetype YAML validation and prompt-version checks,
  # which live as tests under tests/unit/data/ and tests/unit/llm/.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARCHITECT_LLM_BACKEND: fake
      ANTHROPIC_API_KEY: "" # a test that tries the real API fails loudly
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: >
          uv run pytest tests/unit tests/integration
          --junitxml=reports/junit.xml
          --cov=architect --cov-report=term-missing --cov-report=xml:reports/coverage.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: reports/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Terraform checks, only when export code, templates or the module map change
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Terraform changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            terraform:
              - 'src/architect/stages/export/**'
              - 'catalog/modules.yaml'
              - 'catalog/services.yaml'
              - '.github/workflows/ci.yml'

  terraform:
    name: Terraform validate and scan
    needs: changes
    # Always run on main; on PRs, only when relevant files changed.
    if: needs.changes.outputs.terraform == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARCHITECT_LLM_BACKEND: fake
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install dependencies
        run: uv sync --locked --dev

      # Renders one Terraform bundle per sample design in tests/fixtures/designs/
      # into build/terraform/<design>/. No LLM calls and no cloud access.
      - name: Render sample Terraform bundles
        run: uv run python -m architect.stages.export.render_samples --out build/terraform

      - name: Cache Terraform providers and modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-${{ env.TERRAFORM_VERSION }}-${{ hashFiles('catalog/modules.yaml') }}

      - name: terraform fmt, init and validate
        run: |
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          shopt -s nullglob
          dirs=(build/terraform/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::No Terraform bundles were rendered"
            exit 1
          fi
          status=0
          for dir in "${dirs[@]}"; do
            echo "::group::$dir"
            terraform -chdir="$dir" fmt -check -recursive || status=1
            terraform -chdir="$dir" init -backend=false -input=false -no-color || status=1
            terraform -chdir="$dir" validate -no-color || status=1
            echo "::endgroup::"
          done
          exit $status

      # tfsec's rules now live in Trivy; this is the maintained replacement.
      - name: Security scan (Trivy config)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: build/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # Container image, main branch only; skips until a Dockerfile exists
  # ---------------------------------------------------------------------------
  image:
    name: Build and push image
    needs: [lint, test, terraform]
    if: >
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.lint.result == 'success' && needs.test.result == 'success' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Skip quietly until the team adds a Dockerfile.
      - id: dockerfile
        run: |
          if [ -f Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::No Dockerfile yet; skipping image build"; fi

      - if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.dockerfile.outputs.present == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=main

      - if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max