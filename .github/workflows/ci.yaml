name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python version comes from .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true

      - name: Install dependencies
        id: sync
        run: uv sync --locked

      # `!cancelled()` runs every check even if an earlier one fails, so all problems show up in one run
      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Ruff format
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync mypy .
