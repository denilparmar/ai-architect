[project]
name = "ai-architect"
version = "0.1.0"
description = "This project accepts a prompt and builds an entire system for you!"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-openai>=1.6.7",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openai>=3.22.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "streamlit>=1.64.0",
]

[project.scripts]
ai-architect = "console.app:main"
ai-architect-ui = "ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agent", "llm", "memory", "observability", "ui", "console", "config.py", "main.py"]

[tool.mypy]
python_version = "3.11"
exclude = ['^\.venv/']

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff==0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
