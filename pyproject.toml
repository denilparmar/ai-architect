[project]
name = "ai-architect"
version = "0.1.0"
description = "This project accepts a prompt and builds an entire system for you!"
readme = "README.md"
requires-python = ">=3.13, <4.0.0"
dependencies = [
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-openai>=1.6.7",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openai>=3.22.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "ruff>=0.16.9",
    "langgraph (>=1.2.12,<2.0.0)",
    "aws-mcp (>=1.7.0,<2.0.0)",
    "mcp (>=2.3.0,<3.0.0)",
    "awslabs-aws-documentation-mcp-server (>=1.2.2,<2.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "uv (>=0.13.1,<0.14.0)",
]
[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
